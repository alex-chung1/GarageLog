name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore GarageLog.slnx

      - name: Build
        run: dotnet build GarageLog.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test GarageLog.slnx --no-build --configuration Release
